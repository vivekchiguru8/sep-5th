steps:
  # 1. Build image
    - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/sep4th/golang-app:$SHORT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/sep4th/golang-app:latest', '.']
  
  # 2. Push to Artifact Registry (replaces Container Registry in your diagram)
    - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/sep4th/golang-app:$SHORT_SHA']

  # 3. Deploy to Cloud Run (PULL in your diagram)
    - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'golang-app', '--image', 'asia-south1-docker.pkg.dev/$PROJECT_ID/sep4th/golang-app:$SHORT_SHA', '--region', 'asia-south1', '--platform', 'managed', '--allow-unauthenticated']

images:
    - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sep4th/golang-app:$SHORT_SHA'
    - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sep4th/golang-app:latest'